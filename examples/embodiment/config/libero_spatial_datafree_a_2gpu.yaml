# SAME successful method as libero_object_opd_faithful_2gpu, but STRONG 130-generalist student.
# Isolates "student strength": goal run failed = strong student + BAD method (norm-mismatch, rank128).
# This = strong student + GOOD method (MATCHED norm, rank32, rollout_epoch2). Does it work or collapse?
#   student = RLinf-OpenVLAOFT-LIBERO-130-Base-Lora (SFT generalist, object~0.7, libero_130 norm)
#   teacher = RLinf-OpenVLAOFT-LIBERO-130 (GRPO 97% generalist, libero_130 norm) -> MATCHED norm
#   env = libero_object (rollout on object; teacher knows object at ~1.0)
#   rank 32, lr 5e-6, rollout_epoch 2, 10 steps.
defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/openvla_oft@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: "4-5"

runner:
  task_type: embodied
  logger:
    log_path: "/share/fanruochen-local/outputs/datafree_a_spatial_anchor"
    project_name: rlinf
    experiment_name: "datafree_a_spatial_anchor"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: 30
  only_eval: False
  val_check_interval: 10
  save_interval: 100

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  group_size: 8
  rollout_epoch: 2
  eval_rollout_epoch: 1

  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: opd
  opd_mode: distill
  opd_center: False
  loss_type: actor
  # ---- dual-KL BASE anchor (data-free generalization preservation) ----
  # anchor_lambda 0 = plain OPD (baseline); >0 adds forward-KL to frozen base.
  anchor_lambda: 1.0
  anchor_gate: low_ent        # low_ent | high_ent | none  (entropy gate on base confidence)
  anchor_gate_tau: 1.0
  # ---- visual-representation anchor (preserve BROAD OOD generalization, data-free) ----
  visual_anchor_lambda: 0.0   # >0 = cosine-align mid-layer vision+prompt features to frozen base
  visual_anchor_layer: 16
  distill_stage_num: 1
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 5.0

  sampling_params:
    do_sample: True
    temperature_train: 1.6
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

  filter_rewards: False
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 16
    group_size: ${algorithm.group_size}
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    reward_coef: ${algorithm.reward_coef}
    reset_gripper_open: False
  eval:
    total_num_envs: 50
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    group_size: 1
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "/share/fanruochen-local/checkpoints/openvla-7b-base"   # general OpenX OpenVLA-7B (the student)
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 128
  seed: 1234
  enable_offload: True

  use_teacher_distill: True
  teacher_model_path: "/share/fanruochen-local/checkpoints/RLinf-OpenVLAOFT-GRPO-LIBERO-spatial/"   # spatial expert (chunk=1 => 95% LIBERO)
  teacher_unnorm_key: libero_spatial_no_noops   # MATCHED to student (openvla-7b-base) norm
  # frozen BASE anchor = the GENERAL OpenX OpenVLA-7B (preserve Google-robot/SimplerEnv generalization, data-free)
  base_model_path: "/share/fanruochen-local/checkpoints/openvla-7b-base"
  base_unnorm_key: libero_spatial_no_noops

  model:
    model_path: "/share/fanruochen-local/checkpoints/openvla-7b-base"
    model_type: "openvla_oft"
    is_lora: True
    lora_rank: 32
    num_action_chunks: 1   # vanilla single-step (openvla-7b-base is not 8-chunk OFT)

    unnorm_key: libero_spatial_no_noops
    max_prompt_length: 128

  optim:
    lr: 5.0e-6
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
