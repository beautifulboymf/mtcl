# Sequential continual learning on 4 LIBERO suites via on-policy distillation (OPD).
#
#   student  = RLinf-OpenVLAOFT-LIBERO-130-Base-Lora  (SFT generalist, non-cold-start)
#   teacher  = RLinf-OpenVLAOFT-LIBERO-130            (one 130-GRPO generalist, ~97% all suites)
#   schedule = spatial -> object -> goal -> long (libero_10), each stage rehearses old suites
#
# ONE config drives every stage; the driver (run_seqcl_4task.sh) sets the per-stage bits
# via env vars, computed from rlinf/algorithms/embodied_seqcl.py (the core algorithm):
#   SEQCL_STUDENT_PATH   - stage 0 = 130-Base-Lora; stage k>0 = previous stage's ckpt
#   SEQCL_ACTIVE_SUITES  - JSON list, e.g. ["libero_object","libero_spatial"] (new + old)
#   SEQCL_SUITE_WEIGHTS  - JSON dict, e.g. {"libero_object":1.0,"libero_spatial":0.3}
# The env expands active_suites -> libero_130 task ids and oversamples per suite_weights.
#
# NOT auto-run. Launch a single stage manually with the driver.

defaults:
  - env/libero_130@env.train     # aggregated 130-task benchmark = multi-suite vehicle
  - env/libero_130@env.eval
  - model/openvla_oft@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # FSDP needs a CONTIGUOUS gpu range; pick FREE gpus (NEVER gpu2 = other tenant).
    actor,env,rollout: ${oc.env:SEQCL_GPUS,"6-7"}

runner:
  task_type: embodied
  logger:
    log_path: "/share/fanruochen-local/outputs/seqcl_${oc.env:SEQCL_CURRENT_SUITE,stage}"
    project_name: rlinf
    experiment_name: "seqcl_${oc.env:SEQCL_CURRENT_SUITE,stage}"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: ${oc.decode:${oc.env:SEQCL_MAX_STEPS,50}}   # per-stage budget

  only_eval: False
  val_check_interval: -1     # in-training rollout eval is unreliable here -> eval post-hoc
  save_interval: ${oc.decode:${oc.env:SEQCL_SAVE_INTERVAL,25}}  # large -> infrequent disk writes

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  group_size: 8
  rollout_epoch: 4
  eval_rollout_epoch: 1

  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: opd            # VLA-OPD (teacher forward + KL distill)
  opd_mode: distill        # differentiable forward-KL(teacher||student), mode-covering
  distill_kl: forward
  opd_center: False
  loss_type: actor
  distill_stage_num: 1
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 5.0

  sampling_params:
    do_sample: True
    temperature_train: 1.6
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

  filter_rewards: False
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5

env:
  group_name: "EnvGroup"

  train:
    task_suite_name: libero_130
    # active suites (new + rehearsed) by NAME; env expands to libero_130 task ids.
    active_suites: ${oc.decode:${oc.env:SEQCL_ACTIVE_SUITES,'[libero_spatial]'}}
    # rehearsal oversampling: new suite heavy, old suites light. null -> uniform.
    suite_sample_weights: ${oc.decode:${oc.env:SEQCL_SUITE_WEIGHTS,'null'}}
    total_num_envs: 16       # small + safe; scale up if VRAM headroom
    group_size: ${algorithm.group_size}
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    reward_coef: ${algorithm.reward_coef}
    reset_gripper_open: False
  eval:
    task_suite_name: libero_130
    active_suites: ${oc.decode:${oc.env:SEQCL_ACTIVE_SUITES,'[libero_spatial]'}}
    # no suite_sample_weights on eval: uniform coverage of the learned suites.
    total_num_envs: 50
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    group_size: 1
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    # stage 0 = SFT generalist; stage k>0 = previous stage's converted ckpt (driver sets it)
    model_path: ${oc.env:SEQCL_STUDENT_PATH,/share/fanruochen-local/checkpoints/RLinf-OpenVLAOFT-LIBERO-130-Base-Lora}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 128
  seed: 1234
  enable_offload: True

  # VLA-OPD teacher routing: every suite -> the single 130 generalist. The actor de-dups
  # by path, so this loads ONE teacher. Give a suite its own expert ckpt to go
  # multi-teacher later (rlinf/algorithms/embodied_seqcl.py::teacher_map).
  use_teacher_distill: True
  teacher_unnorm_key: libero_130_no_noops_trajall
  teacher_map:
    libero_spatial: "/share/fanruochen-local/checkpoints/RLinf-OpenVLAOFT-LIBERO-130"
    libero_object:  "/share/fanruochen-local/checkpoints/RLinf-OpenVLAOFT-LIBERO-130"
    libero_goal:    "/share/fanruochen-local/checkpoints/RLinf-OpenVLAOFT-LIBERO-130"
    libero_10:      "/share/fanruochen-local/checkpoints/RLinf-OpenVLAOFT-LIBERO-130"

  model:
    model_path: ${oc.env:SEQCL_STUDENT_PATH,/share/fanruochen-local/checkpoints/RLinf-OpenVLAOFT-LIBERO-130-Base-Lora}
    model_type: "openvla_oft"
    is_lora: True
    lora_rank: 128

    unnorm_key: libero_130_no_noops_trajall   # student's native (130) norm
    max_prompt_length: 128

  optim:
    lr: 5.0e-6
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
