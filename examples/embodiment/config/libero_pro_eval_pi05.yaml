# Same as libero_pro_eval.yaml but uses pi0.5 SFT ckpt and pi0_5 model config.

defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: ${oc.decode:${oc.env:RLINF_GPU_RANK,1}}

runner:
  task_type: embodied
  logger:
    log_path: /share/fanruochen-local/outputs/rlinf-eval/pi05_pro_${oc.env:RLINF_LOG_TAG,run}
    project_name: rlinf
    experiment_name: "pi05_pro_${oc.env:RLINF_LOG_TAG,run}"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1
  only_eval: True
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 1
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
  eval:
    task_suite_name: ${oc.env:RLINF_TASK_SUITE,libero_spatial}
    total_num_envs: ${oc.decode:${oc.env:RLINF_NUM_ENVS,50}}
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: ${oc.decode:${oc.env:RLINF_MAX_EP_STEPS,240}}
    max_steps_per_rollout_epoch: ${oc.decode:${oc.env:RLINF_MAX_EP_STEPS,240}}
    group_size: 1
    is_eval: True
    eval_shuffle_for_task_coverage: True
    seed: 0
    video_cfg:
      save_video: False

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: /share/fanruochen-local/checkpoints/RLinf-Pi05-LIBERO-SFT
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 1
  seed: 42
  enable_offload: False
  model:
    model_path: /share/fanruochen-local/checkpoints/RLinf-Pi05-LIBERO-SFT
    num_action_chunks: 5
    add_value_head: True
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
