# Design (a) — PLAIN arm (baseline): OPD LIBERO-spatial into VANILLA openvla-7b-base, NO anchor.
#   student = openvla-7b-base (general OpenX, SimplerEnv Google-robot ~40%, LIBERO-spatial ~0)
#   teacher = RLinf-OpenVLAOFT-GRPO-LIBERO-object (chunk=1 => 95% LIBERO), MATCHED norm libero_object_no_noops
#   anchor_lambda = 0  => this is plain multi-teacher OPD (the forgetting baseline)
# Question: (1) does pure OPD lift the base off 0 on spatial (self-bootstrap)?  (2) does SimplerEnv SR drop (forgetting)?
defaults:
  - env/libero_object@env.train
  - env/libero_object@env.eval
  - model/openvla_oft@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: "2-3"

runner:
  task_type: embodied
  logger:
    log_path: "/share/fanruochen-local/outputs/chain2_object_plain"
    project_name: rlinf
    experiment_name: "chain2_object_plain"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: 15
  only_eval: False
  val_check_interval: 5
  save_interval: 100

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  group_size: 8
  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: opd
  opd_mode: distill
  opd_center: False
  loss_type: actor
  # ---- dual-KL BASE anchor: DISABLED for the plain baseline ----
  anchor_lambda: 0.0
  anchor_gate: low_ent
  anchor_gate_tau: 1.0
  visual_anchor_lambda: 0.0
  visual_anchor_layer: 16
  distill_stage_num: 1
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 5.0

  sampling_params:
    do_sample: True
    temperature_train: 1.6
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

  filter_rewards: False
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 16
    group_size: ${algorithm.group_size}
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    reward_coef: ${algorithm.reward_coef}
    reset_gripper_open: False
  eval:
    total_num_envs: 20
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    group_size: 1
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "/share/fanruochen-local/checkpoints/sft_spatial_2000"   # STUDENT INIT = SFT-bootstrapped (LIBERO-spatial ~30%)
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8     # was 4; fewer grad-accum micro-steps => fewer FSDP all-gather comm rounds
  global_batch_size: 64   # was 128; 64/8 = 8 micro-steps (was 128/4=32) => ~4x less comm-bound train step
  seed: 1234
  enable_offload: False   # was True; CPU<->GPU param swap = 65min/step. Off => resident params, plain arm (2 models) fits 80GB.

  use_teacher_distill: True
  teacher_model_path: "/share/fanruochen-local/checkpoints/RLinf-OpenVLAOFT-GRPO-LIBERO-object/"
  teacher_unnorm_key: libero_object_no_noops
  base_model_path: "/share/fanruochen-local/checkpoints/openvla-7b-base"
  base_unnorm_key: libero_object_no_noops

  model:
    model_path: "/share/fanruochen-local/checkpoints/sft_spatial_2000"   # STUDENT INIT = SFT-bootstrapped (base_model_path below stays VANILLA = anchor target)
    model_type: "openvla_oft"
    is_lora: True
    lora_rank: 32
    num_action_chunks: 1

    unnorm_key: libero_object_no_noops
    max_prompt_length: 128

  optim:
    lr: 5.0e-6
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
