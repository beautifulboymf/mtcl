# Sequential single-task RL for the forgetting study.
# Restricts both train + eval envs to ONE task via task_id_filter.
# Supports resuming from a previous task's ckpt via RLINF_RESUME_DIR.
#
# Env-var controls:
#   RLINF_GPU_RANK        : hardware GPU rank (default 1)
#   RLINF_TASK_ID         : single task id to filter to (default 0)
#   RLINF_MAX_EPOCHS      : training epochs (default 5)
#   RLINF_SAVE_INTERVAL   : save every N epochs (default 5; we typically want only end-ckpt)
#   RLINF_LOG_PATH        : log dir
#   RLINF_EXP_NAME        : experiment name
#   RLINF_RESUME_DIR      : if non-empty, resume from this ckpt dir (path/to/global_step_N)
#   RLINF_MODEL_PATH      : initial weights (default: original SFT ckpt)

defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/pi0@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: ${oc.decode:${oc.env:RLINF_GPU_RANK,1}}

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:RLINF_LOG_PATH,/share/fanruochen-local/outputs/rlinf-forget/seq_run}
    project_name: rlinf-forget
    experiment_name: ${oc.env:RLINF_EXP_NAME,seq_task}
    logger_backends: ["tensorboard"]

  max_epochs: ${oc.decode:${oc.env:RLINF_MAX_EPOCHS,5}}
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: ${oc.decode:${oc.env:RLINF_SAVE_INTERVAL,5}}

  resume_dir: ${oc.env:RLINF_RESUME_DIR,null}
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  # task_id_filter restricts BOTH train and eval rollouts to a single task.
  train:
    total_num_envs: 8
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    task_id_filter: ${oc.decode:${oc.env:RLINF_TASK_IDS,'[0]'}}
    video_cfg:
      save_video: False
  eval:
    total_num_envs: 8
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    is_eval: True
    task_id_filter: ${oc.decode:${oc.env:RLINF_TASK_IDS,'[0]'}}
    video_cfg:
      save_video: False

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: ${oc.env:RLINF_MODEL_PATH,/share/fanruochen-local/checkpoints/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 8
  seed: 42
  enable_offload: False

  model:
    model_path: ${oc.env:RLINF_MODEL_PATH,/share/fanruochen-local/checkpoints/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT}
    num_action_chunks: 5
    add_value_head: True
    openpi:
      detach_critic_input: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    # Cold-start the critic alone for N optimizer steps before joint PPO updates.
    # SFT ckpt has random/untrained value head, so V(s) is garbage → advantages
    # are noisy → policy collapses. Warmup pre-trains V to converge to SFT
    # policy's expected return before the policy gets touched.
    critic_warmup_steps: ${oc.decode:${oc.env:RLINF_CRITIC_WARMUP,10}}

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
