# libero_dance_2gpu.yaml -- the DanceOPD transfer (2606.27377): joint 4-teacher routed OPD
# with the conflict handled at the GRADIENT-SCHEDULING level, nothing else.
#
#   * dance_updates -- every optimizer update is SINGLE-suite (fixed global rotation, same
#     suite on every rank). DanceOPD's stress test: even hard-routed samples lose 22.8%
#     (46% on the most conflicting capability) when several capabilities' gradients are
#     summed in one step -- which is exactly what mt4/mt4w2/slot-joint did every update.
#   * dance_keep_frac 0.25 -- trajectory thinning: keep 1/4 of each suite's samples per
#     step. Their K=1-per-rollout is unreachable at 16 envs; recorded as the compromise.
#   * student = ONE shared LoRA r=128 (mt4w2's exact parameterization) -- no slots, no
#     anchor, no merge. If scheduling alone breaks the conservation band, this is the
#     cleanest place to see it.
#
# Controls this run is read against (all temp 1.0): M0 protocol baseline
# obj .967/spat .88/goal .76/10 .527 macro .783 (150 eps); mt4w2 .750; slot-joint .775.
defaults:
  - env/libero_130@env.train     # aggregated 130-task benchmark = multi-suite vehicle
  - env/libero_130@env.eval
  - model/openvla_oft@actor.model
  - training_backend/fsdp@actor.fsdp_config
  # patch_syncer keeps a FULL CPU snapshot of the 7B model + delta buffers per rank at every
  # sync_model_to_rollout; on 6 ranks that pushes the container cgroup past its 477G max ->
  # kernel oom_kill -> a worker dies mid-collective -> "NCCL watchdog stuck 480s".
  # bucket_syncer streams the weights through 512MB GPU buckets instead (no CPU snapshot).
  # This is also what mt4/mt4w2 ran; changing it would change the run.
  - weight_syncer/bucket_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  # Six GPUs, same count and same default set as mt4 ("0,1,2,3,4,5"). The list need not be
  # contiguous -- unique and ascending is enough -- so point it at whatever is actually free.
  component_placement:
    actor,env,rollout: ${oc.env:MT4SLOT_GPUS,"0,1"}

runner:
  task_type: embodied
  logger:
    log_path: "/share/fanruochen-local/outputs/seqcl_${oc.env:MT4SLOT_TAG,mt4slot}"
    project_name: rlinf
    experiment_name: "seqcl_${oc.env:MT4SLOT_TAG,mt4slot}"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: ${oc.decode:${oc.env:MT4SLOT_MAX_STEPS,15}}    # mt4-comparable

  only_eval: False
  # In-training rollout eval on this student is off by up to +-0.33 in BOTH directions -> it is
  # not evidence. Evaluate post-hoc, greedy, on the converted model instead. -1 also makes the
  # save_interval % val_check_interval interlock vacuous, which is why save_interval is free.
  val_check_interval: -1
  save_interval: ${oc.decode:${oc.env:MT4SLOT_SAVE_INTERVAL,5}}   # mt4: 5

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  # 4, not the seqcl config's 8: this is mt4's RESOLVED value (it passed it as an override).
  # 48 train envs / 6 env ranks = 8 per rank, divisible by 4, so validate_cfg is satisfied.
  group_size: 4
  rollout_epoch: 3
  eval_rollout_epoch: 1

  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: opd            # VLA-OPD (teacher forward + KL distill)
  opd_mode: distill        # differentiable forward-KL(teacher||student), mode-covering
  distill_kl: forward
  opd_center: False
  loss_type: actor
  distill_stage_num: 1
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  # Dynamic per-suite distillation strength, at mt4w2's exact values. The weights are refreshed
  # ONCE per training step (_dw_refresh_weights); the per-micro-batch path only gathers a
  # precomputed tensor. Computing them inside the micro-batch loop is what made the first
  # attempt (mt4w) 5.6x slower -- every `.any()` there forces a device sync and the CPU can no
  # longer run ahead of the GPU. Step 1 runs uniform (no KL accumulated yet), adaptive from
  # step 2 on. Clamped to [0.25, 4.0] so no single suite can take over the batch.
  # OFF (parent: 1.0): with one suite on the expert KL and the rest on the anchor,
  # per-suite adaptive weights have nothing to balance -- they would only rescale the
  # single active suite against itself.
  distill_dyn_weight: 0.0
  distill_w_ema: 0.9
  distill_w_min: 0.25
  distill_w_max: 4.0

  # ---- seqslot LwF anchor -----------------------------------------------------------------
  # forward-KL(M_(k-1) || student) on the NON-round suites' on-policy states, weight 0.3.
  # self_masked: the teacher is the student's own forward with the round's slot excluded --
  # no merged checkpoint is written, read, or held in memory between rounds (the whole
  # round-boundary I/O of the naive design). On-policy anchor states, not held-out demos:
  # support placement measured to matter more than the objective (training_time_preservation).
  anchor_lambda: 0.0        # dance: no anchor -- preservation must come from scheduling
  anchor_mode: self_masked  # inert at lambda 0

  # ---- DanceOPD transfer ------------------------------------------------------------------
  dance_updates: true
  dance_keep_frac: 0.25

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 5.0

  sampling_params:
    do_sample: True
    # 1.0, NOT 1.6. This knob does double duty: it sets the rollout sampling temperature AND it
    # scales the logits that become `action_logits`, which are exactly the tensors the OPD
    # forward-KL is computed on for BOTH student and teacher. At 1.6 the KL is taken between two
    # flattened distributions, the peak contributes almost nothing, and the argmax goes
    # essentially unsupervised (measured: the teacher's top-1 lands at rank ~3.7 in the student
    # and greedy eval collapses). mt4 ran 1.0; so does this.
    temperature_train: 1.0
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

  filter_rewards: False
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5

env:
  group_name: "EnvGroup"

  train:
    task_suite_name: libero_130
    # All four suites at once -- the joint routed form. Fixed here rather than read from an env
    # var: R1 is defined as "mt4's four suites", and a stale export must not be able to silently
    # change which suites the run covers.
    active_suites: [libero_spatial, libero_object, libero_goal, libero_10]
    # null -> uniform across suites, which is what mt4 ran (SEQCL_SUITE_WEIGHTS was unset).
    # The per-suite emphasis in this run comes from distill_dyn_weight, not from resampling.
    suite_sample_weights: null
    total_num_envs: 48       # mt4's value (override); 48 / 6 env ranks = 8 per rank
    group_size: ${algorithm.group_size}
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    reward_coef: ${algorithm.reward_coef}
    reset_gripper_open: False
  eval:
    task_suite_name: libero_130
    active_suites: [libero_spatial, libero_object, libero_goal, libero_10]
    # no suite_sample_weights on eval: uniform coverage of the learned suites.
    total_num_envs: 50
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    group_size: 1
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${oc.env:MT4SLOT_STUDENT_PATH,/share/fanruochen-local/outputs/inc_sft_opd/lwf_long_e1000_merged}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8     # mt4's value (override). 192 / (8 * 6 ranks) = 4 grad-accum steps.
  global_batch_size: 192  # mt4's value (override)
  seed: 1234
  enable_offload: True

  # The four per-suite EXPERT teachers, exactly mt4's set. Every rollout sample is scored by the
  # expert of its OWN suite (routed in fsdp_actor_worker._teacher_forward through the
  # prompt->suite table); teachers are frozen, score only, and never act.
  #
  # `<base>::<adapter>` = a PEFT adapter on a base model. TWO BASES, ON PURPOSE: spatial, object
  # and goal are adapters on base_stats130, while the long teacher is an adapter on the STUDENT's
  # own merged model. The actor groups teachers by base, so this costs 2 bases + 4 adapters
  # rather than four full 7B models (which OOM'd at 78.5 GiB before the grouping existed).
  use_teacher_distill: True
  teacher_unnorm_key: libero_130_no_noops_trajall
  teacher_map:
    libero_spatial: "/share/fanruochen-local/outputs/inc_sft_opd/base_stats130::/share/fanruochen-local/outputs/seqcl_rlspat_opd/spatial_cat_r160"
    libero_object:  "/share/fanruochen-local/outputs/inc_sft_opd/base_stats130::/share/fanruochen-local/outputs/inc_sft_opd/sft_object_base3_cont/openvla-7b-base+libero_object_no_noops+b32+lr-0.0003+lora-r32+dropout-0.0--image_aug/adapters/step_500"
    libero_goal:    "/share/fanruochen-local/outputs/inc_sft_opd/base_stats130::/share/fanruochen-local/outputs/inc_sft_opd/teachers_r160/goal_r160"
    libero_10:      "/share/fanruochen-local/outputs/inc_sft_opd/lwf_long_e1000_merged::/share/fanruochen-local/outputs/seqcl_long_opd130/adapter/long_opd130"

  model:
    model_path: ${oc.env:MT4SLOT_STUDENT_PATH,/share/fanruochen-local/outputs/inc_sft_opd/lwf_long_e1000_merged}
    model_type: "openvla_oft"
    # MUST stay True on the slot path. get_model takes the slot branch from INSIDE the is_lora
    # branch, because the per-leaf FSDP wrap policy that gives slot_A/slot_B their own flat
    # params is only registered when is_lora is set. With it False the trainable slot params
    # land in the enclosing transformer layer's flat param next to the FROZEN base, and FSDP
    # refuses to flatten mixed requires_grad under use_orig_params=False.
    is_lora: True
    # Unused on the slot path (the slot ranks below replace it), kept at mt4's 128 so the two
    # arms differ in exactly one field and a reader can see what the shared LoRA was.
    lora_rank: 128

    # ---- slot-LoRI -------------------------------------------------------------------------
    # Four per-suite LoRA slots on mutually orthogonal input subspaces instead of one shared
    # block, so the four teachers stop overwriting each other in the same parameters.
    #
    # THIS LIVES UNDER actor.model, NOT actor. The rollout worker builds its model from
    # deepcopy(cfg.actor.model) through the same get_model
    # (rlinf/workers/rollout/hf/huggingface_worker.py:95), so putting it here gives the rollout
    # side an identically-shaped model for free and weight sync keeps working on bare
    # state-dict key matching. Under actor: it would be invisible to the rollout worker, the two
    # models would have different parameters, and sync would fail (or silently skip).
    # The actor blanks this key on the deepcopy it makes for each TEACHER (fsdp_actor_worker
    # ~1110), so teachers stay plain PEFT/full models.
    slot_lora:
      enabled: false   # dance: ONE shared LoRA, no slots -- scheduling does the work
      # slot_order fixes the slot INDEX order, and the rank list is built by indexing
      # slot_ranks WITH IT -- never by iterating the mapping, whose order is a YAML accident.
      # The router returns suite_order.index(suite), so a reordering here would quietly send
      # one suite's gradient into another suite's slot.
      slot_order: [libero_10, libero_goal, libero_spatial, libero_object]
      # Rank ~ each suite's DEFICIT at the starting model (long .56, goal .68, spatial .76,
      # object .96): the further a suite is from its teacher, the more subspace it gets --
      # but with a FLOOR of 32. A rank-16 slot spans too thin a subspace to express much of an
      # update no matter how small its deficit, and a slot that cannot move is indistinguishable
      # from one that is never routed to.
      # Sum R = 128 + 64 + 64 + 32 = 288. The tightest constraint is R <= d_in on every adapted
      # module; the smallest adapted d_in in this model is 1024 (measured off mt4's own
      # checkpoint: d_in histogram 1024x72, 1152x85, 2176x1, 4096x218, 4304x28, 8704x1,
      # 11008x32), so 288 leaves a 3.5x margin.
      slot_ranks:
        libero_10: 128
        libero_goal: 64
        libero_spatial: 64
        libero_object: 32
      # Scale the A-side so a slot of rank r starts with the same update magnitude mt4's single
      # rank-128 LoRA had; without it the big and small slots would learn at different effective
      # rates and the rank split would confound the comparison.
      a_scale_mode: match_mt4
      a_scale_ref_rank: 128
      orth_eps: 1.0e-6
      # Newton-Schulz iterations for Ā = (Z Zᵀ)^(-1/2) Z. THE ESCALATION KNOB, and the only
      # one: if slot/orth_err leaves the healthy band (< 1e-3) and enters 1e-3 ~ 5e-2, raise
      # this to 16 and change NOTHING else, then check Z's condition number. Measured here at
      # cond(Z)=20, R=256, d_in=1024, fp32: iters 11 -> 6.8e-2, 12 -> 1.07e-3, 13 -> 1.62e-4,
      # 16 -> 1.64e-4. Above 5e-2 orthogonality has already collapsed and the run is invalid;
      # more iterations do not rescue it (failure is a cliff, not a slope).
      # BOUNDED ABOVE TOO -- this is not "more is safer". The iteration converges only on the
      # range of Z; on any direction where Z Zᵀ is singular the recurrence multiplies by 3/2
      # every step, so on a rank-deficient Z the null-space component grows like 1.5^iters and
      # the result is NaN by iters ~ 50 (at cond(Z)=1e4, already NaN by 30). 16 is safe; 40+
      # is not. Do not raise this past 16 without re-measuring.
      # The converter has no matching flag and merges at the default 12. That is harmless:
      # measured at cond(Z)=20, ‖Ā(16) − Ā(12)‖/‖Ā(12)‖ = 3.3e-5, two orders of magnitude
      # under the 1.66e-3 bf16 rounding floor the merge already accepts.
      orth_iters: 12
      # Alternate which factor trains, by OPTIMIZER UPDATE (3 per step here), cycling "BBA".
      # With B fixed, dW is linear in A and vice versa, so each subproblem is better
      # conditioned than chasing both at once. Orthogonality does NOT depend on this -- it
      # comes from the Z parameterization and holds either way.
      # The last update of every step is forced to B so each saved checkpoint's B matches
      # its own A. That override deliberately does NOT consume the cycle position: with 3
      # updates per step and a 3-character schedule, consuming it would lock A onto the
      # forced update every step, so A would never train at all while slot/phase_is_A read
      # a plausible-looking 0.0.
      # null = train both factors jointly (the R2 ablation).
      # "B": A never trains in seqslot -- see frozen_orth and the header. The actor
      # REFUSES round_table/frozen_orth combined with any schedule that moves A.
      alt_schedule: "B"
      # Orthonormalize every Z once at construction and skip the per-forward
      # Newton-Schulz: A is a constant this run, and mt4slotA measured 779 ms/step
      # (3.94%) recomputing it.
      frozen_orth: true
    # -----------------------------------------------------------------------------------------

    unnorm_key: libero_130_no_noops_trajall   # student's native (130) norm
    max_prompt_length: 128

  optim:
    lr: 5.0e-6
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    # False: don't recompute activations in backward -> faster (uses more VRAM, which 6 GPUs
    # have). Same as mt4.
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
