defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/openvla_oft@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/bucket_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: ${oc.env:RL_PLACEMENT,"0,1,2,6"}

runner:
  task_type: embodied
  logger:
    log_path: "/share/fanruochen-local/outputs/rl_long_${oc.env:RL_TAG,t1}"
    project_name: rlinf
    experiment_name: "rl_long_${oc.env:RL_TAG,t1}"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: ${oc.decode:${oc.env:RL_SAVE,5}}

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  
  rollout_epoch: ${oc.decode:${oc.env:RL_ROLLOUT_EPOCH,4}} # 16->4: proven with global_batch 8192 on 4 gpu
  eval_rollout_epoch: 1 # set eval_rollout_epoch > 0 when enable runner.only_eval or runner.val_check_interval > 0
  group_size: 8  # number of groups per rollout step
  
  reward_type: action_level  # action_level or chunk_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 5.0

  sampling_params:
    do_sample: True
    # 1.6 is the setting the spatial/object GRPO runs were proven with, so it is the default. But
    # note this student's own temperature sweep peaks near 1.0-1.3 and is clearly worse at 1.6, so
    # rollouts here sample BELOW the policy's real ability -> depressed reward. Lowering it raises
    # rollout SR but shrinks within-group variance, and GRPO needs that variance to form advantages
    # (filter_rewards drops all-same groups). If the reward stays pinned at 0 or the filtered
    # fraction is huge, try RL_TEMP=1.2 before touching anything else.
    temperature_train: ${oc.decode:${oc.env:RL_TEMP,1.6}}
    temperature_eval: ${oc.decode:${oc.env:RL_TEMP,1.6}}
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  # length argument for autoregressive sampling
  # max length means max amount of tokens to generate
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

  filter_rewards: True
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5

env:
  group_name: "EnvGroup"
  
  # Override the default values in env/libero_10
  train:
    total_num_envs: ${oc.decode:${oc.env:RL_ENVS,32}}  # 32//4gpu//1 = 8 = group_size; 64 blew the 800-proc red line
    max_steps_per_rollout_epoch: 512
    max_episode_steps: 512 # max episode steps for truncation
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    reset_gripper_open: False
  eval:
    total_num_envs: ${oc.decode:${oc.env:RL_EVAL_ENVS,8}}  # 500 = process explosion; in-training eval is unreliable anyway
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: False   # video writes are pure IO cost; judge by post-hoc greedy
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${oc.env:RL_INIT_MODEL,/share/fanruochen-local/outputs/inc_sft_opd/lwf_long_e1000_merged}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: ${oc.decode:${oc.env:RL_MICRO,32}}
  global_batch_size: ${oc.decode:${oc.env:RL_GLOBAL_BATCH,8192}}
  seed: 1234
  enable_offload: True

  # Override the default values in model/openvla_oft
  model:
    model_path: ${oc.env:RL_INIT_MODEL,/share/fanruochen-local/outputs/inc_sft_opd/lwf_long_e1000_merged}
    model_type: "openvla_oft"
    max_prompt_length: 128
    is_lora: True
    lora_rank: ${oc.decode:${oc.env:RL_LORA_RANK,128}}
    lora_path: ${oc.env:RL_INIT_ADAPTER,???}
    unnorm_key: libero_130_no_noops_trajall

  optim:
    lr: ${oc.decode:${oc.env:RL_LR,1.0e-4}}
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  # Override the default values in training_backend/fsdp
  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False