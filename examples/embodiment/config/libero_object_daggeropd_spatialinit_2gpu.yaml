defaults:
  - env/libero_object@env.train
  - env/libero_object@env.eval
  - model/openvla_oft@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: "2-3"   # DUAL-GPU: contiguous free pair GPU2+GPU3 (FSDP world=2)

runner:
  task_type: embodied
  logger:
    log_path: "/share/fanruochen-local/outputs/obj_daggeropd_spatialinit"
    project_name: rlinf
    experiment_name: "obj_daggeropd_spatialinit"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: 25            # DAgger-OPD bootstrap test

  only_eval: False
  val_check_interval: -1
  save_interval: 25        # -> global_step_25 + best-ckpt

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  group_size: 8
  rollout_epoch: 4
  eval_rollout_epoch: 1

  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: opd            # VLA-OPD (teacher forward + reverse-KL) -- SAME loss as pure-OPD run
  opd_mode: distill        # differentiable KL(student||teacher)
  opd_center: False
  loss_type: actor         # NOT embodied_dagger -> we keep the OPD reverse-KL loss
  distill_stage_num: 1
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 5.0

  # DAgger beta-schedule: rollout starts TEACHER-driven (hard distill, student sees SUCCESS states)
  # then decays toward student-driven (on-policy OPD). Gated on rollout.expert_model presence;
  # update_dagger_beta() runs at the top of every generate_one_epoch. only_save_expert=True ->
  # NO classic-dagger relabel; we just want teacher-driven rollout feeding the OPD reverse-KL loss.
  dagger:
    init_beta: 1.0
    beta_decay: 0.99       # slow decay -> stays teacher-heavy (max bootstrap chance for test-1)
    beta_min: 0.05
    beta_schedule: exponential
    only_save_expert: True

  sampling_params:
    do_sample: True
    temperature_train: 1.6
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

  filter_rewards: False
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 16
    group_size: ${algorithm.group_size}
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    reward_coef: ${algorithm.reward_coef}
    reset_gripper_open: False
  eval:
    total_num_envs: 50
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    group_size: 1
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "/share/fanruochen-local/checkpoints/Openvla-oft-SFT-libero-spatial-traj1"   # student = spatial-SFT (0 on object)
    precision: ${actor.model.precision}

  # DAgger driver: the object expert drives the rollout with prob beta (teacher-forcing).
  expert_model:
    model_path: "/share/fanruochen-local/checkpoints/RLinf-OpenVLAOFT-GRPO-LIBERO-object/"
    precision: ${actor.model.precision}
    unnorm_key: libero_object_no_noops   # expert's native key (worker patch respects this)

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 128
  seed: 1234
  enable_offload: True

  # OPD reverse-KL target = object expert (same model that drives the rollout)
  use_teacher_distill: True
  teacher_model_path: "/share/fanruochen-local/checkpoints/RLinf-OpenVLAOFT-GRPO-LIBERO-object/"
  teacher_unnorm_key: libero_object_no_noops

  model:
    model_path: "/share/fanruochen-local/checkpoints/Openvla-oft-SFT-libero-spatial-traj1"   # student = spatial-SFT
    model_type: "openvla_oft"
    is_lora: True
    lora_rank: 32

    unnorm_key: libero_spatial_no_noops   # student's native key
    max_prompt_length: 128

  optim:
    lr: 5.0e-6
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
