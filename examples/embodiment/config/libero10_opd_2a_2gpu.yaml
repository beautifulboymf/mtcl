defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/openvla_oft@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: "2-3"   # Step-2a DUAL-GPU: contiguous free pair GPU2+GPU3 (FSDP world=2)

runner:
  task_type: embodied
  logger:
    log_path: "/share/fanruochen-local/outputs/s2a_130_opd"
    project_name: rlinf
    experiment_name: "s2a_130_opd_libero10"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: 50            # Step-2a: 50-step premise check

  only_eval: False
  val_check_interval: -1   # in-training rollout eval is broken/unreliable -> disabled; eval post-hoc
  save_interval: 25        # -> global_step_25 + global_step_50

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False   # VLA-OPD: raw reverse-KL reward used directly (no adv norm)
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 8
  rollout_epoch: 16
  eval_rollout_epoch: 1 # set eval_rollout_epoch > 0 when enable runner.only_eval or runner.val_check_interval > 0

  reward_type: action_level  # action_level or chunk_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: opd            # VLA-OPD path (teacher forward + reverse-KL)
  opd_mode: distill        # distill = differentiable KL(student||teacher) loss (pi0 op_distill style);
                           # rl = REINFORCE with reverse-KL advantage (original, didn't converge)
  opd_center: False        # (rl mode only) subtract per-token mean baseline
  loss_type: actor         # unchanged: PPO-clip update on the opd advantage
  distill_stage_num: 1
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 5.0

  sampling_params:
    do_sample: True
    temperature_train: 1.6
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  # length argument for autoregressive sampling
  # max length means max amount of tokens to generate
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

  filter_rewards: False   # VLA-OPD uses RKL reward, not env reward; env-reward filtering would
                          # drop the weak student's (uniformly-failing) groups -> empty batch -> zero loss
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5

env:
  group_name: "EnvGroup"

  # Override the default values in env/libero_10
  train:
    total_num_envs: 16   # keep 16 (dual-GPU splits GPU work, NOT env count -> CPU physics load unchanged)
    group_size: ${algorithm.group_size}
    max_episode_steps: 512 # max episode steps for truncation
    max_steps_per_rollout_epoch: 512
    reward_coef: ${algorithm.reward_coef}
    reset_gripper_open: False
  eval:
    total_num_envs: 50
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    group_size: 1
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "/share/fanruochen-local/checkpoints/RLinf-OpenVLAOFT-LIBERO-130"   # Step-2a init = unified 130 generalist
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4        # per-rank; resident frozen teacher -> small micro batch
  global_batch_size: 128     # world=2 -> per-rank 64; rollout_size % (gbs/world)==0 must hold (verify on first step)
  seed: 1234
  enable_offload: True

  # VLA-OPD: frozen teacher (RL'd libero10 expert) scores the student's rollouts
  use_teacher_distill: True
  teacher_model_path: "/share/fanruochen-local/checkpoints/RLinf-OpenVLAOFT-GRPO-LIBERO-long/"
  teacher_unnorm_key: libero_10_no_noops   # teacher's native norm key (differs from student's 130 key)

  # Override the default values in model/openvla_oft
  model:
    model_path: "/share/fanruochen-local/checkpoints/RLinf-OpenVLAOFT-LIBERO-130"   # Step-2a init = unified 130 generalist
    model_type: "openvla_oft"
    is_lora: True            # LoRA the student (base frozen); teacher is separate full model
    lora_rank: 32

    unnorm_key: libero_130_no_noops_trajall   # 130's native (only) norm key
    max_prompt_length: 128

  optim:
    lr: 5.0e-6               # SimpleVLA-RL/VLA-OPD teacher-training lr
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  # Override the default values in training_backend/fsdp
  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
