# Sequential single-task GRPO for forgetting study.
# Uses GRPO (no value function) to sidestep PPO value cold-start instability.
#
# Env-var controls (same as the PPO variant):
#   RLINF_GPU_RANK / RLINF_TASK_IDS / RLINF_MAX_EPOCHS / RLINF_SAVE_INTERVAL
#   RLINF_LOG_PATH / RLINF_EXP_NAME / RLINF_RESUME_DIR / RLINF_MODEL_PATH

defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/pi0@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # Accepts either a single rank ("1") or a continuous range ("4-5") via env var.
    actor,env,rollout: ${oc.env:RLINF_GPU_RANK,1}

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:RLINF_LOG_PATH,/share/fanruochen-local/outputs/rlinf-forget/grpo_seq_run}
    project_name: rlinf-forget
    experiment_name: ${oc.env:RLINF_EXP_NAME,grpo_seq_task}
    logger_backends: ["tensorboard"]

  max_epochs: ${oc.decode:${oc.env:RLINF_MAX_EPOCHS,5}}
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: ${oc.decode:${oc.env:RLINF_SAVE_INTERVAL,5}}

  resume_dir: ${oc.env:RLINF_RESUME_DIR,null}
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  # GRPO: 8 samples per group, advantage = (reward - group_mean) / group_std
  group_size: 8
  reward_coef: 1.0

  rollout_epoch: ${oc.decode:${oc.env:RLINF_ROLLOUT_EPOCH,1}}
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: ${oc.decode:${oc.env:RLINF_UPDATE_EPOCH,1}}
  adv_type: grpo
  loss_type: actor                # NO critic
  loss_agg_func: "token-mean"
  kl_beta: ${oc.decode:${oc.env:RLINF_KL_BETA,0.0}}
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: True
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  # 8 envs == 1 group at the same init state for GRPO relative-advantage.
  train:
    # 16 envs = 2 groups × group_size 8 across 2 GPUs (rank 4-5).
    total_num_envs: ${oc.decode:${oc.env:RLINF_TRAIN_ENVS,16}}
    group_size: ${algorithm.group_size}
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    task_id_filter: ${oc.decode:${oc.env:RLINF_TASK_IDS,'[0]'}}
    video_cfg:
      save_video: False
  eval:
    total_num_envs: ${oc.decode:${oc.env:RLINF_EVAL_ENVS,16}}
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    is_eval: True
    task_id_filter: ${oc.decode:${oc.env:RLINF_TASK_IDS,'[0]'}}
    video_cfg:
      save_video: False

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: ${oc.env:RLINF_MODEL_PATH,/share/fanruochen-local/checkpoints/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # With 2 GPUs and 16 train envs, scale batches up to use both.
  micro_batch_size: ${oc.decode:${oc.env:RLINF_MICRO_BATCH,4}}
  global_batch_size: ${oc.decode:${oc.env:RLINF_GLOBAL_BATCH,16}}
  seed: 42
  enable_offload: False

  model:
    model_path: ${oc.env:RLINF_MODEL_PATH,/share/fanruochen-local/checkpoints/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT}
    # 10 = pi0 default; halves rollout time vs 5 (240/10 = 24 inferences/ep vs 48).
    # Trade-off: policy adapts every 10 actions instead of 5 (slightly more open-loop).
    num_action_chunks: 10
    # NO value head for GRPO
    add_value_head: False

  optim:
    lr: ${oc.decode:${oc.env:RLINF_LR,5.0e-6}}
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
