# pi0 SFT on RL-collected t3 pseudo-demos (LeRobot dataset built from best-ckpt rollouts).
# Starts from the same SFT init checkpoint that the RL chain started from, so the SFT-vs-RL
# comparison is apples-to-apples. Pure flow-matching BC loss, no rollouts/rewards.
# NEW FILE (does not modify upstream libero_sft_openpi.yaml).
defaults:
  - model/pi0@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # single-GPU: launch sets RLINF_SFT_PLACEMENT="G-G"; multi-GPU FSDP: "A-A,B-B" (only the
    # named GPUs, range-per-GPU so an in-between tenant GPU is never grabbed). world_size =
    # number of resource ranks -> gradient_accumulation = global // micro // world.
    actor,env,rollout: "${oc.env:RLINF_SFT_PLACEMENT,0-0}"

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:RLINF_SFT_LOG_PATH,../results}
    project_name: rlinf
    experiment_name: ${oc.env:RLINF_SFT_EXP,sft_t3_collected}
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: ${oc.decode:${oc.env:RLINF_SFT_MAX_STEPS,100}}
  val_check_interval: -1
  save_interval: ${oc.decode:${oc.env:RLINF_SFT_SAVE_INTERVAL,20}}

data:
  train_data_paths: ${oc.env:RLINF_SFT_DATA,/share/fanruochen-local/datasets/sft_collected_t3}

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: ${oc.decode:${oc.env:RLINF_SFT_MICRO_BATCH,4}}
  global_batch_size: ${oc.decode:${oc.env:RLINF_SFT_GLOBAL_BATCH,64}}
  seed: 0

  model:
    precision: null
    model_path: ${oc.env:RLINF_SFT_MODEL_PATH,/share/fanruochen-local/checkpoints/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT}
    num_action_chunks: 4
    add_value_head: False
    openpi:
      config_name: "pi0_libero"
      detach_critic_input: True

  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    warmup_style: "cosine"
    lr_warmup_steps: 5          # 100-step run: tiny warmup so LR actually ramps (default 1000 would never warm up)
    total_training_steps: 100   # cosine decay horizon = our max_steps

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: False
    gradient_checkpointing: False   # openpi: not supported, do not change
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
